<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Original Track B topology redraw</title>
  <desc id="desc">A not-to-scale original redraw of the University of Waterloo CS452 Track B topology, showing its two loop fields, central special-turnout interlock, staging tracks, forty sensor pairs, and twenty-two turnout positions.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#171a1b" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <style>
      .bed{fill:none;stroke:#111516;stroke-opacity:.08;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
      .rail{fill:none;stroke:#171a1b;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
      .secondary{stroke:#68706d;stroke-width:2.2}
      .cross{stroke:#ff5b3b;stroke-width:2.4}
      .sensor-label{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#303635;paint-order:stroke;stroke:#e9e7de;stroke-width:5;stroke-linejoin:round}
      .turnout text{font:800 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#f8f7f1}
      .turnout circle{fill:#171a1b;stroke:#ff5b3b;stroke-width:2}
      .special text{font:800 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#171a1b}
      .special circle{fill:#ff5b3b;stroke:#f8f7f1;stroke-width:3}
      .eyebrow{font:800 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2.4px;fill:#646b68}
      .heading{font:700 40px Helvetica,Arial,sans-serif;letter-spacing:-1.5px;fill:#111516}
      .note{font:700 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#6d7471}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#e9e7de"/>
  <rect width="1400" height="820" fill="url(#grid)"/>
  <text class="eyebrow" x="54" y="45">TRACK B / ORIGINAL TOPOLOGY REDRAW</text>
  <text class="heading" x="54" y="84">Two loop fields. One central interlock.</text>
  <text class="note" x="1346" y="45" text-anchor="end">SCHEMATIC · NOT TO SCALE</text>

